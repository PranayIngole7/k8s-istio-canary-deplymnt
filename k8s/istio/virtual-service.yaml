apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: canary-routing
  namespace: canary-demo
spec:
  hosts:
    - canary-service.canary-demo.svc.cluster.local
  http:
    - route:
        - destination:
            host: canary-service.canary-demo.svc.cluster.local
            subset: stable
          weight: 80
        - destination:
            host: canary-service.canary-demo.svc.cluster.local
            subset: canary
          weight: 20
